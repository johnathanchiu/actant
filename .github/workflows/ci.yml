name: ci

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main: a stacked branch is
  # still code someone is about to merge, and it was going unchecked.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --python 3.11 --extra dev --extra providers

      - name: Lint
        run: uv run --extra dev --extra providers ruff check actant tests examples

      - name: Type check
        run: uv run --extra dev --extra providers pyright actant tests

      - name: Test
        run: uv run --extra dev --extra providers python -m pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Install and import the provider-neutral wheel
        run: |
          test_env="$(mktemp -d)/venv"
          uv venv "$test_env" --python 3.11
          uv pip install --python "$test_env/bin/python" dist/*.whl
          cd "$(mktemp -d)"
          "$test_env/bin/python" - <<'PY'
          import actant
          from actant import AgentDefinition
          from actant.llm import Message, llm_for_model, provider_for_model
          from actant.runtime import AgentRuntime
          from actant.tools import ToolRegistry

          assert actant.__file__ is not None
          assert AgentDefinition is not None
          assert Message is not None
          assert AgentRuntime is not None
          assert ToolRegistry is not None
          assert provider_for_model("gpt-example") == "openai"

          missing_extras = {
              "gpt-example": "actant[openai]",
              "claude-example": "actant[anthropic]",
              "gemini/example-model": "actant[gemini]",
              "qwen-example": "actant[qwen]",
          }
          for model, extra in missing_extras.items():
              try:
                  llm_for_model(model)
              except ImportError as exc:
                  assert extra in str(exc)
              else:
                  raise AssertionError(f"{model} unexpectedly loaded without {extra}")
          PY

  # The demo server is its own uv project, so it needs its own install to be
  # type-checked against real dependencies. It is checked because it went
  # stale unnoticed: the library changed under it and nothing failed.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/demo/server
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: examples/demo/server/uv.lock

      - name: Install
        run: uv sync --python 3.11

      # Type check only. Linting happens in the python job, from the repo
      # root, so examples are held to the same ruff config as the library
      # rather than whatever a nested directory resolves to.
      - name: Type check
        run: uv run --with pyright pyright --venvpath . --project . app

  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/demo/ui
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build docs
        run: uv run --group docs mkdocs build --strict

  required:
    name: ci / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [python, package, demo, viewer, docs]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.python.result }}" != "success" ]; then
            echo "python job did not succeed"
            exit 1
          fi
          if [ "${{ needs.package.result }}" != "success" ]; then
            echo "package job did not succeed"
            exit 1
          fi
          if [ "${{ needs.demo.result }}" != "success" ]; then
            echo "demo job did not succeed"
            exit 1
          fi
          if [ "${{ needs.viewer.result }}" != "success" ]; then
            echo "viewer job did not succeed"
            exit 1
          fi
          if [ "${{ needs.docs.result }}" != "success" ]; then
            echo "docs job did not succeed"
            exit 1
          fi
